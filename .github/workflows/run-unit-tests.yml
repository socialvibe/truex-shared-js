name: CI/CD - Unit Tests

# Run tests on PRs targeting `develop`. Pushes to develop are tested in the Release workflow.
on:
  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Upload Test Summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: test-results/junit.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Tests
          path: test-results/junit.xml
          reporter: java-junit
