name: Run Unit Tests

# Run tests on pushes and PRs targeting develop
on:
  push:
    branches: [ "develop" ]

  pull_request:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Dependencies
        run: yarn install

      - name: Run Unit Tests
        run: yarn run test:ci

      - name: Test Report
        uses: dorny/test-reporter@v2
        with:
          name: Jest Unit Tests
          path: test-results/junit.xml
          reporter: jest-junit
