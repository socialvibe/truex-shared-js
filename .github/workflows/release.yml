name: CI/CD - Release

# On every merge to develop: test, publish the private GitHub package, then tag and create a GitHub release
on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: write
  packages: write
  checks: write

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Upload Test Summary
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-summary
          path: junit.xml

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Tests
          path: junit.xml
          reporter: java-junit

  release:
    needs: unit-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@socialvibe'

      - name: Use consumer README for the published package
        run: |
          cp README_NPM.md README.md
          rm -f README_NPM.md

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --target develop --generate-notes
